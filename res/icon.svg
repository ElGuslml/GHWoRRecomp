<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <!-- The GHWoRRecomp icon: a guitar pick with a lightning bolt on a riveted steel medallion. The pick is the one at the
       heart of GH Warriors of Rock Launcher's art (launcher/art/background.svg: its fire gradient, its bolt, its warm
       steel and stage), drawn for this project (no art from the game); GHMetalRecomp's, GHVanHRecomp's and GH5Recomp's
       icon with its own pick. res/make_icon.mjs builds res/icon.ico from this file (40 px and up) and icon_small.svg
       (16-32 px). -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f2ee"/>
      <stop offset="0.35" stop-color="#a9a6a1"/>
      <stop offset="0.55" stop-color="#e4e1db"/>
      <stop offset="1" stop-color="#5e5b57"/>
    </linearGradient>
    <radialGradient id="stage" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#2a1a14"/>
      <stop offset="0.6" stop-color="#120e0d"/>
      <stop offset="1" stop-color="#070606"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="0.5" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#b3260c"/>
    </linearGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#5e5b57"/>
    </radialGradient>
    <clipPath id="inside">
      <circle cx="128" cy="128" r="88"/>
    </clipPath>
    <circle id="stud" r="4.6" fill="url(#rivet)" stroke="#1b1917" stroke-width="1.5"/>
    <path id="ray" d="M 128,128 L 117,20 L 139,20 Z"/>
    <path id="sparkle" d="M 0,-9 L 2,-2 L 9,0 L 2,2 L 0,9 L -2,2 L -9,0 L -2,-2 Z" fill="#edeae4"/>
    <path id="pick" d="M 128,204 C 100,178 66,140 66,104 C 66,74 98,58 128,58 C 158,58 190,74 190,104
                       C 190,140 156,178 128,204 Z"/>
  </defs>

  <!-- Medallion: a steel rim with eight rivets, the stage dark in the middle. -->
  <circle cx="128" cy="128" r="106" fill="url(#steel)" stroke="#1b1917" stroke-width="4"/>
  <circle cx="128" cy="128" r="101" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
  <use xlink:href="#stud" transform="translate(218.5 165.5)"/>
  <use xlink:href="#stud" transform="translate(165.5 218.5)"/>
  <use xlink:href="#stud" transform="translate(90.5 218.5)"/>
  <use xlink:href="#stud" transform="translate(37.5 165.5)"/>
  <use xlink:href="#stud" transform="translate(37.5 90.5)"/>
  <use xlink:href="#stud" transform="translate(90.5 37.5)"/>
  <use xlink:href="#stud" transform="translate(165.5 37.5)"/>
  <use xlink:href="#stud" transform="translate(218.5 90.5)"/>
  <circle cx="128" cy="128" r="90" fill="url(#stage)" stroke="#1b1917" stroke-width="4"/>

  <!-- Stage light: rays from the middle and the orange glow behind the pick, as in the launcher's art. -->
  <g clip-path="url(#inside)">
    <g fill="#ffffff" fill-opacity="0.05">
      <use xlink:href="#ray"/>
      <use xlink:href="#ray" transform="rotate(30 128 128)"/>
      <use xlink:href="#ray" transform="rotate(60 128 128)"/>
      <use xlink:href="#ray" transform="rotate(90 128 128)"/>
      <use xlink:href="#ray" transform="rotate(120 128 128)"/>
      <use xlink:href="#ray" transform="rotate(150 128 128)"/>
      <use xlink:href="#ray" transform="rotate(180 128 128)"/>
      <use xlink:href="#ray" transform="rotate(210 128 128)"/>
      <use xlink:href="#ray" transform="rotate(240 128 128)"/>
      <use xlink:href="#ray" transform="rotate(270 128 128)"/>
      <use xlink:href="#ray" transform="rotate(300 128 128)"/>
      <use xlink:href="#ray" transform="rotate(330 128 128)"/>
    </g>
    <circle cx="128" cy="130" r="88" fill="url(#glow)"/>
  </g>

  <!-- The pick: a warm white border around it, then the art's fire pick, its shade and highlight, and its bolt (the
       art's pick is 120 x 134 around 0, 3: scaled 1.08 it is this pick). -->
  <use xlink:href="#pick" fill="none" stroke="#edeae4" stroke-width="16" stroke-linejoin="round"/>
  <use xlink:href="#pick" fill="url(#fire)"/>
  <g transform="translate(128 128) scale(1.08)">
    <path d="M0 70 C24 46 44 20 52 -6 C40 22 22 44 0 60 Z" fill="#8e1e0a" opacity="0.5"/>
    <path d="M0 58 C-26 32 -48 4 -48 -20 C-48 -42 -26 -52 0 -52" fill="none" stroke="#ffd25a" stroke-width="3"
          stroke-linecap="round" opacity="0.8"/>
  </g>
  <use xlink:href="#pick" fill="none" stroke="#0b0a0a" stroke-width="6" stroke-linejoin="round"/>
  <!-- The art's bolt 1.2 times as wide (around x 4) and 1 unit up, to read at 40-64 px. -->
  <g transform="translate(128 127) scale(1.08)">
    <path d="M11.2 -50 L-22.4 4 H-0.8 L-15.2 52 L25.6 -10 H4 L20.8 -50 Z" fill="#edeae4" stroke="#0b0a0a"
          stroke-width="4" stroke-linejoin="round"/>
    <path d="M13.6 -44 L-4 -8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Sparkles -->
  <use xlink:href="#sparkle" transform="translate(70 70)"/>
  <use xlink:href="#sparkle" transform="translate(190 178) scale(0.75)"/>
</svg>
