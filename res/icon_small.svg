<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- icon.svg simplified for 16-32 px: no rivets, rays, glow, sparkles or highlights; a thicker rim and a bigger pick. -->
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f2ee"/>
      <stop offset="0.5" stop-color="#b5b1ab"/>
      <stop offset="1" stop-color="#5e5b57"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc24e"/>
      <stop offset="0.55" stop-color="#ff6a1a"/>
      <stop offset="1" stop-color="#c93a10"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="122" fill="url(#steel)" stroke="#1b1917" stroke-width="8"/>
  <circle cx="128" cy="128" r="98" fill="#16110f" stroke="#1b1917" stroke-width="8"/>

  <g transform="translate(128 130) scale(1.16) translate(-128 -131)">
    <path d="M 128,204 C 100,178 66,140 66,104 C 66,74 98,58 128,58 C 158,58 190,74 190,104
             C 190,140 156,178 128,204 Z" fill="url(#fire)" stroke="#0d0d0f" stroke-width="9" stroke-linejoin="round"/>
    <path d="M 141,72 L 101,139 L 125,139 L 113,186 L 157,115 L 132,115 L 153,72 Z" fill="#ffffff"
          stroke="#111113" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
